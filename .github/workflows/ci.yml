name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cwh
          POSTGRES_PASSWORD: cwh
          POSTGRES_DB: cloud_waste_hunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cwh:cwh@localhost:5432/cloud_waste_hunter_test
      AUTH_SECRET: ci-placeholder-secret
      AUTH_MICROSOFT_ENTRA_ID_ID: ci-placeholder
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ci-placeholder
      LIGHTHOUSE_PROVIDER_PRINCIPAL_ID: ci-placeholder
      LIGHTHOUSE_PROVIDER_TENANT_ID: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test

      - run: npm run build
